[project]
name = "herbora-backend"
version = "1.0.0"
description = "Herbora Ayurvedic Botanical Knowledge & Identification API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
]

[tool.vercel]
entrypoint = "app.py"
